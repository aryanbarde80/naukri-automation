# ============================================================
#  render.yaml - Render.com Deployment Configuration
# ============================================================
services:
  - type: web
    name: naukri-automation
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free

    envVars:
      - key: NAUKRI_USERNAME
        sync: false          # Set this in Render Dashboard
      - key: NAUKRI_PASSWORD
        sync: false          # Set this in Render Dashboard
      - key: SEARCH_KEYWORDS
        value: "SDE, Software Development Engineer, SDE-1, SDE-2, Software Engineer, Backend Engineer, Full Stack Developer, Frontend Developer, AIML Engineer, AI Engineer, ML Engineer, Machine Learning Engineer, Data Scientist, Data Engineer, MLOps Engineer, LLM Engineer, GenAI Engineer, NLP Engineer, Computer Vision Engineer, Deep Learning Engineer, SDET, QA Automation Engineer, DevOps Engineer, Site Reliability Engineer, Platform Engineer, Cloud Engineer, Java Developer, Python Developer, Node.js Developer, React Developer, Spring Boot Developer, Microservices Engineer"
      - key: CANDIDATE_EXPERIENCE
        value: "4"
      - key: CANDIDATE_LOCATIONS
        value: "Indore, Pune, Noida, Bangalore, Hyderabad, Mumbai, Remote"
      - key: MAX_JOBS_TO_APPLY
        value: "999999"

    healthCheckPath: /
